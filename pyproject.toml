[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cake-taste-64"
version = "0.1.0"
description = "Bounded N64 experiments and native-output evidence"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
  "textual==8.2.8",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9"]

[project.scripts]
taste = "cake_taste.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cake_taste", "cake_taste.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.setuptools.package-data]
"cake_taste.catalog" = ["page.html"]
